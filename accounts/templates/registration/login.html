{% extends 'base.html' %}
{% block title %} | Sign Up{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">
    <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>

</form>
{% endblock %}
